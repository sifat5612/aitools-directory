<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Tools Directory</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

header{
background:#2563eb;
padding:25px;
text-align:center;
}

h1{
margin:0;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

input{
width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:18px;
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.card h2{
margin-top:0;
}

.btn{
display:inline-block;
padding:12px 20px;
background:#22c55e;
color:white;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}
</style>

</head>

<body>

<header>
<h1>🔥 Free AI Tools Directory</h1>
<p>Discover the Best Free AI Tools</p>
</header>

<div class="container">

<input type="text" placeholder="Search AI Tools...">

<div class="card">
<h2>ChatGPT</h2>
<p>AI Chat Assistant</p>
<a class="btn" href="https://chat.openai.com" target="_blank">Visit</a>
</div>

<div class="card">
<h2>Gemini</h2>
<p>Google AI Assistant</p>
<a class="btn" href="https://gemini.google.com" target="_blank">Visit</a>
</div>

<div class="card">
<h2>Claude</h2>
<p>AI Writing Assistant</p>
<a class="btn" href="https://claude.ai" target="_blank">Visit</a>
</div>

</div>

</body>
</html>
